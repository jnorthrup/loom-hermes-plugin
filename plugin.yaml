name: loom
version: 0.2.0
author: James R. Northrup (jnorthrup)
description: "Nests /goal work as a push/pop stack of prompt frames at the front of every request (nested-loop shape). The front moves only when the conversation behind it was already rewritten, so prefix caches (koboldcpp --loomcache, Anthropic, OpenAI/Codex) keep the frames and the whole conversation; compaction as the built-in compressor"
